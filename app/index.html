    <!-- Boot page: only shown on the first visit (and after a hard refresh), before the service

         silhouettes (skeleton.ts). -->
    <main>
      <!-- Hidden on screen, until there is a problem (register-sw.ts puts the text in). -->
      <p id="status" role="status" data-quiet></p>
      <div id="patch"><div class="skeleton"></div></div>
    </main>
    <script type="module" src="/src/register-sw.ts"></script>
  </body>
